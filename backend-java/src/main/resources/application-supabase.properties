# ============================================================
# Configurações do Spring Boot com Banco de Dados SUPABASE (PostgreSQL)
# ============================================================
# Para ativar este perfil: rodar com --spring.profiles.active=supabase
# Ou copiar o conteúdo para application.properties
# ============================================================

server.port=8080

# Configuração da URL JDBC do Supabase
# Obtenha em: Supabase Dashboard > Project Settings > Database > Connection string (JDBC)
# Exemplo de URL via Connection Pooling (Porta 6543 / 5432):
# jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?user=postgres.SEU_PROJETO&password=SUA_SENHA
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.SEU_PROJETO_REF
spring.datasource.password=SUA_SENHA_DO_BANCO
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configurações de JWT
jwt.secret=SUA_CHAVE_SECRETA_JWT_MINIMO_256_BITS_AQUI
jwt.expiration=1800000

# CORS permitido (inclui Netlify)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,https://seu-app.netlify.app

# Logging
logging.level.root=INFO
logging.level.br.org.cdlbh.fornecedores=DEBUG
