# ============================================================
# Configurações do Spring Boot - TEMPLATE
# ============================================================
# Este é um arquivo de exemplo para configuração
# Copie este arquivo para application.properties e preencha com valores reais
# NÃO commitar o application.properties com valores reais no repositório
# ============================================================

# Configurações do servidor
server.port=8080

# Configurações do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cdl_bh_fornecedores_java
spring.datasource.username=root
spring.datasource.password=

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT
jwt.secret=SUA_CHAVE_SECRETA_JWT_AQUI
jwt.expiration=1800000

# Configurações de CORS (origens permitidas)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://172.16.1.61:5173

# Configurações de backup
backup.directory=../backups
mysql.mysqldump-path=mysqldump
mysql.mysqlbinlog-path=mysqlbinlog

# Configurações de logging
logging.level.root=INFO
logging.level.br.org.cdlbh.fornecedores=DEBUG
