# ============================================================
# Configurações do Spring Boot - MODO TESTE LOCAL (H2 em Memória)
# ============================================================
# Para rodar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Ou defina: spring.profiles.active=local
# Não necessita de MySQL ou Supabase rodando na máquina!
# ============================================================

server.port=8080

# Banco H2 em memória com modo de compatibilidade MySQL
spring.datasource.url=jdbc:h2:mem:cdl_bh_fornecedores;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria as tabelas automaticamente em memória
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Console Web do H2 habilitado em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT para testes locais (válido por 24 horas)
jwt.secret=CHAVE_SECRETA_PARA_TESTES_LOCAIS_CDL_BH_FORNECEDORES_JAVA_SPRING_BOOT_2026
jwt.expiration=86400000

# CORS aberto para testes locais
cors.allowed-origins=*

# Backups simulados em pasta local
backup.directory=./backups
mysql.mysqldump-path=mysqldump
mysql.mysqlbinlog-path=mysqlbinlog

# Logging amigável
logging.level.root=INFO
logging.level.br.org.cdlbh.fornecedores=INFO
